name: build

# Сборка под Windows идёт ЗДЕСЬ, а не на маке: ни PyInstaller, ни Rust не
# кросс-компилируют .exe и .dll с macOS. Артефакт скачивается со страницы запуска.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Право создавать релиз и прикреплять к нему файл
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Забрать движок памяти
        uses: actions/checkout@v4
        with:
          repository: vitaliyfedotovpro-art/astrum-hsam-embedded
          path: hsam

      - name: Собрать HSAM как DLL
        working-directory: hsam
        run: cargo rustc --release --crate-type cdylib

      - name: Положить DLL рядом с кодом
        shell: bash
        run: |
          mkdir -p diary/lib
          cp hsam/target/release/astrum_memory.dll diary/lib/
          ls -la diary/lib/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Сборка
        run: pyinstaller --clean --noconfirm diary.spec

      - name: Проверить, что файл собрался
        shell: bash
        run: |
          test -f dist/Diary.exe || (echo "Diary.exe не собран" && exit 1)
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Diary-windows
          path: dist/Diary.exe
          retention-days: 30

      # Релиз с постоянной ссылкой на скачивание — только когда пушится тег,
      # чтобы ручные запуски не плодили пустых релизов.
      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Diary.exe
          name: Diary ${{ github.ref_name }}
          body: |
            Personal speaking diary — Windows build.

            **Download `Diary.exe` below and double-click it.** Nothing to install.

            On first launch Windows shows a blue "Windows protected your PC" screen —
            the file isn't signed by a big company, that's all. Click **More info** →
            **Run anyway**. It only asks once.

            The diary runs on your own machine and never listens to the network.
