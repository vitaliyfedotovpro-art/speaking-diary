name: build

# The builds happen HERE rather than on the author's machine: neither PyInstaller nor
# Rust cross-compiles — a binary for each system is built on that system.
# A `v*` tag builds all three and puts them into one release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Permission to create a release and attach files to it
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false        # if macOS fails, Windows must still get through
      matrix:
        include:
          - os: windows-latest
            asset: Diary.exe
            built: dist/Diary.exe
          # macos-latest is Apple Silicon. For Intel, add a row with macos-13 and
          # the asset Diary-macos-x86_64.
          - os: macos-latest
            asset: Diary-macos-arm64
            built: dist/Diary
          # The version is pinned rather than ubuntu-latest: the binary carries the
          # glibc of the system it was built on, and "latest" would silently move the
          # compatibility floor one day. 22.04 cannot be used — GitHub begins retiring
          # it on 17.09.2026 and drops it entirely by 17.04.2027. 24.04 means glibc 2.39.
          - os: ubuntu-24.04
            asset: Diary-linux-x86_64
            built: dist/Diary
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch the memory engine
        uses: actions/checkout@v4
        with:
          repository: vitaliyfedotovpro-art/astrum-hsam-embedded
          path: hsam

      - name: Build HSAM as a dynamic library
        working-directory: hsam
        run: cargo rustc --release --crate-type cdylib

      - name: Put the library next to the code
        shell: bash
        run: |
          mkdir -p diary/lib
          # The name differs on every system (.dll / .dylib / .so) — copy by pattern
          # so there is no need for three branches and no way to miss the lib prefix.
          found=0
          for f in hsam/target/release/*astrum_memory*.dll \
                   hsam/target/release/*astrum_memory*.dylib \
                   hsam/target/release/*astrum_memory*.so; do
            [ -f "$f" ] || continue
            cp "$f" diary/lib/
            found=1
          done
          if [ "$found" != "1" ]; then
            echo "the engine library did not build:"; ls -la hsam/target/release/ | head -30
            exit 1
          fi
          ls -la diary/lib/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --clean --noconfirm diary.spec

      - name: Check the file was built, and give it the platform's name
        shell: bash
        run: |
          test -f "${{ matrix.built }}" || (echo "${{ matrix.built }} was not built"; ls -la dist/; exit 1)
          mv "${{ matrix.built }}" "dist/${{ matrix.asset }}"
          # On macOS and Linux the executable bit has to survive the trip to the user
          chmod +x "dist/${{ matrix.asset }}" || true
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          retention-days: 30

      # A release only on a tag, so manual runs do not breed empty ones.
      # Each job attaches its own file to the same release.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
          name: Diary ${{ github.ref_name }}
          body: |
            Personal speaking diary — download the file for your system.

            | system | file |
            |---|---|
            | Windows | `Diary.exe` |
            | macOS (Apple Silicon) | `Diary-macos-arm64` |
            | Linux (x86_64) | `Diary-linux-x86_64` |

            Nothing to install. The diary runs on your own machine and never
            listens to the network — it opens a page at `127.0.0.1`.

            **Windows.** Double-click it. The first launch shows a blue
            "Windows protected your PC" screen: the file isn't signed by a big
            company, that's all. Click **More info** → **Run anyway**. Once only.

            **macOS.** The file isn't notarised, so Gatekeeper will refuse it on a
            double-click. Open a terminal in the folder you downloaded it to:

            ```
            chmod +x Diary-macos-arm64
            xattr -d com.apple.quarantine Diary-macos-arm64
            ./Diary-macos-arm64
            ```

            **Linux.** Built on Ubuntu 24.04; needs glibc 2.39 or newer
            (Ubuntu 24.04+, Debian 13+, Fedora 40+). On older systems build from
            source — see the README.

            ```
            chmod +x Diary-linux-x86_64
            ./Diary-linux-x86_64
            ```
